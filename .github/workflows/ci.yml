name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The floor for every job: read the code, nothing else. `authz-scan` raises its
# own ceiling where it is declared, because it is the only job that writes
# anything.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Start demo API
        run: |
          nohup python -m uvicorn examples.rest_api.server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/users/u1 -H "Authorization: Bearer alice-token" && break
            sleep 0.5
          done
      - name: Run overstep against the demo API
        # The demo API is intentionally vulnerable, so we don't fail the build on
        # its findings — we just prove the tool runs and produces reports.
        run: |
          overstep run examples/rest_api/matrix.yaml --out out --fail-on never
      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overstep-report-${{ matrix.python-version }}
          path: out/

  # Example of how a real project would gate a PR on authorization findings and
  # publish them to GitHub code scanning.
  authz-scan:
    runs-on: ubuntu-latest
    # `upload-sarif` writes to the code-scanning API, and the repository's
    # default token is read-only, so every push to main failed on that step
    # while the pull request that preceded it passed. The scan itself was fine:
    # uploading is this job's only real output, which made authz-scan a no-op on
    # main with nothing ever reaching the Security tab.
    #
    # Scoped to this job rather than declared at the top level, where it would
    # also reach the build-test matrix — four jobs that pip-install and run a
    # test suite, and so execute third-party code that would be holding a token
    # able to rewrite code-scanning data for no reason. A job block replaces the
    # top-level one outright, so `contents: read` is restated here.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: Start demo API
        run: |
          nohup python -m uvicorn examples.rest_api.server:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/users/u1 -H "Authorization: Bearer alice-token" && break
            sleep 0.5
          done
      - name: overstep authorization scan
        run: overstep run examples/rest_api/matrix.yaml --out out --fail-on never
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/overstep.sarif
